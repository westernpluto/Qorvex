name: Build iOS app

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XC" ] && [ -d /Applications/Xcode.app ] && /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version | grep -q "Xcode 27" && XC=/Applications/Xcode.app
          if [ -z "$XC" ]; then echo "::error::Xcode 27 not found on this runner"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project Qorvex.xcodeproj -scheme Qorvex -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Qorvex.app Payload/
          zip -qry "Qorvex-1.0.${{ github.run_number }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Qorvex-1.0.${{ github.run_number }}
          path: Qorvex-1.0.${{ github.run_number }}.ipa
          retention-days: 30

  screenshots:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          XC="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Qorvex.xcodeproj -scheme Qorvex -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Boot an iPhone Duo simulator and take screenshots
        run: |
          mkdir -p shots
          xcrun simctl list devicetypes > shots/devicetypes.txt
          xcrun simctl list runtimes > shots/runtimes.txt
          TYPE=$(xcrun simctl list devicetypes | grep -i "duo" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          [ -z "$TYPE" ] && TYPE=$(xcrun simctl list devicetypes | grep -i "iPhone" | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          # The Duo ships with its own runtime build (e.g. iOS-27-2-iPhone19-4); prefer it.
          RUNTIME=$(xcrun simctl list runtimes | grep -i "iPhone19" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
          [ -z "$RUNTIME" ] && RUNTIME=$(xcrun simctl list runtimes | grep -i "iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
          xcrun simctl help > shots/simctl-help.txt 2>&1 || true
          xcrun simctl ui 2> shots/simctl-ui.txt || true
          echo "Device type: $TYPE  Runtime: $RUNTIME" | tee shots/device.txt
          UDID=$(xcrun simctl create QorvexShots "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find simbuild/Build/Products -name "Qorvex.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          shoot() {
            xcrun simctl terminate "$UDID" com.qorvex.reader 2>/dev/null || true
            xcrun simctl launch "$UDID" com.qorvex.reader "$@"
            sleep 8
            # The Duo has two displays: 3 = inner (unfolded), 1 = outer (folded).
            xcrun simctl io "$UDID" screenshot --display=3 "shots/$NAME-inner.png" || true
            xcrun simctl io "$UDID" screenshot --display=1 "shots/$NAME-outer.png" || true
          }
          xcrun simctl help io > shots/simctl-io-help.txt 2>&1 || true
          NAME=home shoot -QXTab home
          NAME=post shoot -QXTab home -QXOpenSample
          NAME=communities shoot -QXTab communities
          NAME=search shoot -QXTab search
          NAME=saved shoot -QXTab saved
          NAME=settings shoot -QXTab settings
          xcrun simctl ui "$UDID" appearance light || true
          NAME=home-light shoot -QXTab home -QXOpenSample
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-screenshots
          path: shots
          retention-days: 14
