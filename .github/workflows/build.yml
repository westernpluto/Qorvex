name: Build iOS app

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (27 if available, else newest)
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then
            XC="$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)"
            echo "::warning::Xcode 27 is not on this runner image yet; using $(basename "$XC")"
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project Qorvex.xcodeproj -scheme Qorvex -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Qorvex.app Payload/
          zip -qry Qorvex-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Qorvex-unsigned-ipa
          path: Qorvex-unsigned.ipa
          retention-days: 30
